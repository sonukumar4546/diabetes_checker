<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; background-color: #f8f9fa; }
        .container { max-width: 1100px; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); border-radius: 0.5rem; }
        .card-header { background-color: #007bff; color: white; font-weight: bold; border-bottom: none; border-top-left-radius: 0.5rem; border-top-right-radius: 0.5rem; }
        .form-label { font-weight: bold; }
        .visualization-img { max-width: 100%; height: auto; margin-bottom: 20px; border: 1px solid #ddd; padding: 5px; border-radius: 0.25rem; }
        .nav-tabs .nav-link.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
        .nav-tabs .nav-link {
            color: #007bff;
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
        }
        .tab-content { border: 1px solid #dee2e6; border-top: none; padding: 20px; border-bottom-left-radius: 0.5rem; border-bottom-right-radius: 0.5rem; background-color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-5 text-center text-primary">Diabetes Prediction & Analysis</h1>

        <ul class="nav nav-tabs mb-3" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="predictor-tab" data-bs-toggle="tab" data-bs-target="#predictor" type="button" role="tab" aria-controls="predictor" aria-selected="true">Predictor</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="visualizations-tab" data-bs-toggle="tab" data-bs-target="#visualizations" type="button" role="tab" aria-controls="visualizations" aria-selected="false">Visualizations</button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="predictor" role="tabpanel" aria-labelledby="predictor-tab">
                <div class="card">
                    <div class="card-header">Predict Diabetes Outcome</div>
                    <div class="card-body">
                        <form id="predictionForm">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="Pregnancies" class="form-label">Pregnancies:</label>
                                    <input type="number" class="form-control" id="Pregnancies" name="Pregnancies" min="0" max="17" value="1" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="Glucose" class="form-label">Glucose (mg/dL):</label>
                                    <input type="number" class="form-control" id="Glucose" name="Glucose" min="0" max="200" value="120" required>
                                </div>
                            </div>

                            <div class="row g-3 mt-2">
                                <div class="col-md-6">
                                    <label for="BloodPressure" class="form-label">Blood Pressure (mmHg):</label>
                                    <input type="number" class="form-control" id="BloodPressure" name="BloodPressure" min="0" max="122" value="70" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="SkinThickness" class="form-label">Skin Thickness (mm):</label>
                                    <input type="number" class="form-control" id="SkinThickness" name="SkinThickness" min="0" max="99" value="20" required>
                                </div>
                            </div>

                            <div class="row g-3 mt-2">
                                <div class="col-md-6">
                                    <label for="Insulin" class="form-label">Insulin (muU/ml):</label>
                                    <input type="number" class="form-control" id="Insulin" name="Insulin" min="0" max="846" value="79" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="BMI" class="form-label">BMI (kg/m²):</label>
                                    <input type="number" class="form-control" id="BMI" name="BMI" step="0.1" min="0" max="67.1" value="25" required>
                                </div>
                            </div>

                            <div class="row g-3 mt-2">
                                <div class="col-md-6">
                                    <label for="DiabetesPedigreeFunction" class="form-label">Diabetes Pedigree Function:</label>
                                    <input type="number" class="form-control" id="DiabetesPedigreeFunction" name="DiabetesPedigreeFunction" step="0.001" min="0.078" max="2.42" value="0.372" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="Age" class="form-label">Age:</label>
                                    <input type="number" class="form-control" id="Age" name="Age" min="21" max="81" value="30" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary mt-4">Get Prediction</button>
                        </form>

                        <div id="predictionResult" class="mt-4 p-3 border rounded alert alert-info" style="display:none;">
                            <h4>Prediction Result:</h4>
                            <p><strong>Outcome:</strong> <span id="outcome"></span></p>
                            <p><strong>Probability (No Diabetes):</strong> <span id="prob0"></span></p>
                            <p><strong>Probability (Diabetes):</strong> <span id="prob1"></span></p>
                        </div>
                        <div id="predictionError" class="mt-4 p-3 border rounded alert alert-danger" style="display:none;">
                            <h4>Error:</h4>
                            <p><span id="errorMessage"></span></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="visualizations" role="tabpanel" aria-labelledby="visualizations-tab">
                <div class="card">
                    <div class="card-header">Model Visualizations</div>
                    <div class="card-body">
                        <p class="lead mb-4">Explore the insights from the model's training data.</p>

                        <h3 class="mt-4">Feature Importance</h3>
                        <img src="{{ url_for('static', filename='chart/feature_importance (1).png') }}" alt="Feature Importance Plot" class="visualization-img img-fluid">

                        <h3 class="mt-4">Correlation Heatmap</h3>
                        <img src="{{ url_for('static', filename='chart/correlation_heatmap.png') }}" alt="Correlation Heatmap" class="visualization-img img-fluid">

                        <h3 class="mt-4">Pairplot by Outcome</h3>
                        <img src="{{ url_for('static', filename='chart/pairplot.png') }}" alt="Pairplot" class="visualization-img img-fluid">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const form = event.target;
            const formData = new FormData(form);
            const data = {};
            for (let [key, value] of formData.entries()) {
                // Convert values to numbers, handling floats and integers
                if (key === 'BMI' || key === 'DiabetesPedigreeFunction') {
                    data[key] = parseFloat(value);
                } else {
                    data[key] = parseInt(value, 10);
                }
            }

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    document.getElementById('outcome').textContent = result.prediction === 1 ? 'Positive (Has Diabetes)' : 'Negative (No Diabetes)';
                    document.getElementById('prob0').textContent = (result.probability_class_0 * 100).toFixed(2) + '%';
                    document.getElementById('prob1').textContent = (result.probability_class_1 * 100).toFixed(2) + '%';
                    document.getElementById('predictionResult').style.display = 'block';
                    document.getElementById('predictionError').style.display = 'none';
                } else {
                    document.getElementById('errorMessage').textContent = result.error || 'An unknown error occurred.';
                    document.getElementById('predictionError').style.display = 'block';
                    document.getElementById('predictionResult').style.display = 'none';
                }
            } catch (error) {
                document.getElementById('errorMessage').textContent = 'Network error or server unavailable: ' + error.message;
                document.getElementById('predictionError').style.display = 'block';
                document.getElementById('predictionResult').style.display = 'none';
            }
        });
    </script>
</body>
</html>
